services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_workflow
      POSTGRES_USER: ai_workflow
      POSTGRES_PASSWORD: ai_workflow_dev
    ports:
      - '5432:5432'
    volumes:
      - ai-workflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_workflow -d ai_workflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai-workflow-postgres-data:
